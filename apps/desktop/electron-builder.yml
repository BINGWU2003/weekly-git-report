appId: com.weeklygitreport.desktop
productName: Weekly Git Report
asar: true
directories:
  output: release
artifactName: Weekly-Git-Report-Setup-${version}-${arch}.${ext}
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: BINGWU2003
  repo: weekly-git-report
  releaseType: draft
npmRebuild: false
