appId: com.weeklygitreport.desktop
productName: Weekly Git Report
asar: true
directories:
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
npmRebuild: false
